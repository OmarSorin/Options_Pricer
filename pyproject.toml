[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optionlab"
version = "0.1.0"
description = "Educational options pricing library: Black-Scholes, Greeks, trees, Monte Carlo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]
# Independent cross-checks: QuantLib reference prices and mutation testing.
validation = ["QuantLib>=1.30", "cosmic-ray>=8.3"]
# Convergence plot (scripts/plot_convergence.py).
plots = ["matplotlib>=3.8"]
# Interactive demo in the browser (app/streamlit_app.py).
app = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
